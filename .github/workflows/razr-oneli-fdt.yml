name: Razr oneli compiled FDT audit

on:
  push:
    branches: [razr/boot]
    paths:
      - 'arch/arm64/boot/dts/qcom/sm8475*'
      - '.github/workflows/razr-oneli-fdt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Drzet/razr2022_nuc
          ref: ceb102384214cbaa714e9ebf88765fe97f786ea4
          path: project-audit
          persist-credentials: false
      - name: Build and inspect exact oneli DTB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update > evidence/apt.log 2>&1
          sudo apt-get install -y --no-install-recommends make gcc-aarch64-linux-gnu bc bison flex device-tree-compiler >> evidence/apt.log 2>&1
          {
            git rev-parse HEAD
            python3 --version
            dtc --version
            aarch64-linux-gnu-gcc --version | head -n 1
          } > evidence/versions.txt 2>&1
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make O=out defconfig 2>&1 | tee evidence/configure.log
          make O=out -j"$(nproc)" qcom/sm8475-motorola-oneli.dtb 2>&1 | tee evidence/build.log
          python3 project-audit/tests/scripts/check-oneli-dtb.py \
            out/arch/arm64/boot/dts/qcom/sm8475-motorola-oneli.dtb \
            --output evidence/audit.json 2>&1 | tee evidence/audit.log
      - name: Retain proof
        if: always()
        run: |
          echo "kernel=$GITHUB_SHA" > evidence/identity.txt
          if test -f out/arch/arm64/boot/dts/qcom/sm8475-motorola-oneli.dtb; then
            cp out/arch/arm64/boot/dts/qcom/sm8475-motorola-oneli.dtb evidence/
          fi
          if test -f out/.config; then cp out/.config evidence/config; fi
          (cd evidence && sha256sum * > SHA256SUMS) || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: oneli-fdt-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
