name: VPU production lifecycle host checks
on:
  push:
    branches: [razr/vpu-closure-tests]
    paths:
      - tests/vpu_iris_cb_lifecycle.py
      - tests/vpu_iommu_ranges.py
      - tests/vpu_iris_probe_unwind.py
      - drivers/media/platform/qcom/iris/iris_probe.c
      - drivers/iommu/of_iommu.c
      - .github/workflows/vpu-closure-lifecycle.yml
  workflow_dispatch:
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Execute extracted production child registration and unwind
        run: |
          python3 tests/vpu_iris_cb_lifecycle.py
          python3 tests/vpu_iommu_ranges.py
          python3 tests/vpu_iris_probe_unwind.py
