name: Razr PS5169 durable attributed import and ARM64 integration

on:
  push:
    branches: [razr/usb-ps5169]
    paths:
      - .github/workflows/razr-ps5169-durable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install ARM64 kernel and DT tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libelf-dev libssl-dev libncurses-dev dwarves curl device-tree-compiler python3-venv
      - name: Attribute upstream v3, commit separate fixes and publish candidate branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ps5169-arm64-record
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git rev-parse HEAD | tee ps5169-arm64-record/preimport-sha.txt
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            'https://patchew.org/linux/20260810-ps5169-bup-v3-0-a2178b2834d7@proton.me/mbox' \
            -o ps5169-arm64-record/upstream-v3.mbox
          sha256sum ps5169-arm64-record/upstream-v3.mbox \
            > ps5169-arm64-record/mbox-volatile-sha.txt
          git am --3way ps5169-arm64-record/upstream-v3.mbox
          git log -2 --format='%H %an <%ae> %s' | tee ps5169-arm64-record/original-authorship.txt
          echo 'b76465571bc5a7f80a177660e9290115fedcfbccda1fb43c801e25a6f3a521ed  drivers/usb/typec/mux/ps5169.c' | sha256sum -c -
          echo '3c9f01f921398edf34e7d3b13439306bd26e8f48a75151294ec529c83b852cc3  Documentation/devicetree/bindings/usb/parade,ps5169.yaml' | sha256sum -c -
          python3 scripts/razr/ps5169-candidate-headers.py
          git diff --check
          git add drivers/usb/typec/mux/ps5169.c
          git commit -m 'usb: typec: ps5169: add missing direct include dependencies' \
            -m 'Keep original v3 upstream authorship in preceding commits; this fixes its reported isolated build failure.'
          git show --format=fuller --stat HEAD > ps5169-arm64-record/include-commit.txt
          python3 scripts/razr/ps5169-candidate-power.py
          git diff --check
          git add drivers/usb/typec/mux/ps5169.c Documentation/devicetree/bindings/usb/parade,ps5169.yaml
          git commit -m 'usb: typec: ps5169: model VCC and VIO as separate supplies' \
            -m 'Proposed oneli source-based VCC S10B and VIO L8C contract. Does not claim GPIO19 reset polarity or enable a board DT.'
          git show --format=fuller --stat HEAD > ps5169-arm64-record/supplies-commit.txt
          git log -5 --format='%H %an <%ae> %s' | tee ps5169-arm64-record/final-authorship.txt
          git rev-parse HEAD | tee ps5169-arm64-record/tested-source-sha.txt
          git push origin HEAD:refs/heads/razr/usb-ps5169
      - name: Validate attributable driver binding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ps5169-schema-venv
          .ps5169-schema-venv/bin/python -m pip install dtschema
          .ps5169-schema-venv/bin/python -m pip freeze > ps5169-arm64-record/schema-pip-freeze.txt
          PATH="$PWD/.ps5169-schema-venv/bin:$PATH" \
            make DT_SCHEMA_FILES=Documentation/devicetree/bindings/usb/parade,ps5169.yaml dt_binding_check \
            2>&1 | tee ps5169-arm64-record/schema.log
      - name: Full dependency-resolved ARM64 Image and modules build
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            aarch64-linux-gnu-gcc --version | head -1
            dtc --version
            make --version | head -1
            uname -a
          } > ps5169-arm64-record/toolchain.txt
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig 2>&1 \
            | tee ps5169-arm64-record/defconfig.log
          scripts/config --enable I2C --enable REGMAP_I2C --enable DRM \
            --enable DRM_BRIDGE --enable TYPEC --module TYPEC_MUX_PS5169
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig \
            2>&1 | tee ps5169-arm64-record/olddefconfig.log
          cp .config ps5169-arm64-record/resolved-arm64.config
          grep -E '^CONFIG_(TYPEC|TYPEC_MUX_PS5169|I2C|REGMAP_I2C|DRM|REGULATOR)=' .config \
            | tee ps5169-arm64-record/selected-config.txt
          grep -qx 'CONFIG_TYPEC_MUX_PS5169=m' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image modules \
            2>&1 | tee ps5169-arm64-record/image-modules.log
          test -s arch/arm64/boot/Image
          test -s Module.symvers
          test -s drivers/usb/typec/mux/ps5169.ko
          sha256sum arch/arm64/boot/Image Module.symvers \
            drivers/usb/typec/mux/ps5169.ko \
            | tee ps5169-arm64-record/output-sha256.txt
          aarch64-linux-gnu-readelf -h drivers/usb/typec/mux/ps5169.ko \
            | tee ps5169-arm64-record/ps5169-module-elf.txt
          aarch64-linux-gnu-readelf -s drivers/usb/typec/mux/ps5169.ko \
            | tee ps5169-arm64-record/ps5169-module-symbols.txt
      - name: Preserve validation artifacts and exact final state
        if: always()
        run: |
          git status --short > ps5169-arm64-record/git-status.txt || true
          git rev-parse HEAD > ps5169-arm64-record/end-sha.txt || true
          find ps5169-arm64-record -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: razr-ps5169-arm64-${{ github.sha }}
          path: ps5169-arm64-record/
          if-no-files-found: error
