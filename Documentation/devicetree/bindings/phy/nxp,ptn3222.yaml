%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/nxp,ptn3222.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: NXP PTN3222 1-port eUSB2 to USB2 redriver

maintainers:
  - Dmitry Baryshkov <dmitry.baryshkov@linaro.org>

properties:
  compatible:
    enum:
      - nxp,ptn3222

  reg:
    maxItems: 1

  "#phy-cells":
    const: 0

  vdd1v8-supply:
    description: power supply (1.8V)

  vdd3v3-supply:
    description: power supply (3.3V)

  reset-gpios: true

  nxp,usb2-tuning-profile:
    $ref: /schemas/types.yaml#/definitions/string
    enum:
      - motorola,oneli
    description: |
      Board-specific USB2 signal conditioning profile from Motorola oneli's
      stock device tree. Programs USB2 RX control to 0x40, TX control 1 to
      0x22 and TX control 2 to 0x64 in device/OTG mode or 0x24 in host mode.
      Requests 1.8 V before 3.075-3.3 V and releases reset after both supplies
      are enabled. Requires readable PTN3222 CUK/GM or HUK chip identification
      registers; an unidentified part is rejected before any tuning writes.
      This profile does not identify the board's populated repeater; the
      compatible and physical reset polarity must be established separately.

required:
  - compatible
  - reg
  - '#phy-cells'

additionalProperties: false

allOf:
  - if:
      required:
        - nxp,usb2-tuning-profile
    then:
      required:
        - reset-gpios
        - vdd1v8-supply
        - vdd3v3-supply

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        redriver@4f {
            compatible = "nxp,ptn3222";
            reg = <0x4f>;
            #phy-cells = <0>;
            vdd3v3-supply = <&vreg_3p3>;
            vdd1v8-supply = <&vreg_1p8>;
            reset-gpios = <&gpio_reset GPIO_ACTIVE_LOW>;
        };
    };
...
