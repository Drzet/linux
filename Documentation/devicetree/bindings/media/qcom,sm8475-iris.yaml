%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,sm8475-iris.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM8475 Iris2 video accelerator

maintainers:
  - Vikash Garodia <quic_vgarodia@quicinc.com>
  - Dikshita Agarwal <dikshita.agarwal@oss.qualcomm.com>

description: |
  [INFERRED] Upstream SM8475-specific compatible and resource translation
  for the VPU2 Iris controller documented by Qualcomm's Waipio/Cape video
  device tree as shipped in Motorola's source. Firmware and board operation
  are not verified. This is a candidate binding, not an enabled oneli node.

allOf:
  - $ref: qcom,venus-common.yaml#

properties:
  compatible:
    const: qcom,sm8475-iris

  clocks:
    maxItems: 3

  clock-names:
    items:
      - const: iface
      - const: core
      - const: vcodec0_core

  power-domains:
    minItems: 2
    maxItems: 4

  power-domain-names:
    minItems: 2
    items:
      - const: venus
      - const: vcodec0
      - const: mxc
      - const: mmcx

  firmware-name:
    maxItems: 1

  interconnects:
    minItems: 2
    maxItems: 2

  interconnect-names:
    items:
      - const: cpu-cfg
      - const: video-mem

  iommus:
    minItems: 2
    maxItems: 2

  resets:
    minItems: 2
    maxItems: 2

  reset-names:
    items:
      - const: bus
      - const: core

  dma-coherent: true

  operating-points-v2: true

required:
  - compatible
  - firmware-name
  - interconnects
  - interconnect-names
  - power-domain-names
  - resets
  - reset-names
  - iommus
  - dma-coherent

unevaluatedProperties: false
...
