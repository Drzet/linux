%YAML 1.2
---
$id: http://devicetree.org/schemas/media/qcom,sm8475-iris-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM8475 Iris nonsecure DMA consumers (experimental RFC)

maintainers:
  - Vikash Garodia <quic_vgarodia@quicinc.com>
  - Dikshita Agarwal <dikshita.agarwal@oss.qualcomm.com>

description: |
  Proposed ABI for two independently enumerated DMA consumers referenced in
  nonpixel,pixel order by the Iris controller's qcom,dma-consumers property.
  Each owns one nonsecure SMMU stream match entry and a separate DMA domain.
  These nodes are peers of the controller on the SoC bus; they have no MMIO
  registers or dependency on controller probe. Secure contexts are excluded.
  This software topology is experimental, not observed physical topology.

  memory-region references exactly two IOVA-only reservations, without reg,
  each containing a single iommu-addresses tuple targeting this consumer.
  With the SoC bus's two address and two size cells, the first excludes
  [0,0x25800000) for nonpixel or [0,0x00100000) for pixel. The second excludes
  [0xe0000000,0x100000000). This conserves reference software windows; their
  necessity on hardware is unproven. Both consumers use a contiguous 32-bit
  DMA mask. The controller's physical PAS firmware carveout stays separate.

properties:
  compatible:
    enum:
      - qcom,sm8475-iris-nonpixel
      - qcom,sm8475-iris-pixel

  iommus:
    maxItems: 1
    description: |
      One apps SMMU SID/mask pair, 0x2180/0x400 for nonpixel or
      0x2187/0x400 for pixel, from the stock reference DT.

  memory-region:
    items:
      - description: IOVA-only lower exclusion, targeting this consumer
      - description: IOVA-only upper exclusion, targeting this consumer

  dma-coherent: true

required:
  - compatible
  - iommus
  - memory-region
  - dma-coherent

additionalProperties: false
...
